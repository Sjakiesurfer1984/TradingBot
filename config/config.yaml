strategies:
  - name: pmcc
    asset_class: crypto #equity   # "equity" | "crypto" | "forex"
    pmcc:
      underlying_symbol: SPY
      max_units: 5

      leap:
        dte_min: 450
        dte_max: 560
        target_delta: 0.80

      short:
        dte_min: 21
        dte_max: 45
        target_delta: 0.20

      roll:
        near_dte_threshold: 14
        near_profit_pct_high_iv:   0.50
        near_profit_pct_normal_iv: 0.55
        near_profit_pct_low_iv:    0.65
        near_strike_proximity: 0.95
        near_max_roll_debit: 2.00
        leap_dte_threshold: 90
        leap_strike_danger: 0.90

      liquidity:
        max_leap_spread_pct: 0.10
        max_near_spread_pct: 0.10

      risk:
        max_buying_power_fraction: 0.50
        max_debit_per_spread_usd: 50000
        max_contracts_per_intent: 3
        slippage_factor: 1.05
        ignore_spread_checks: false

default_dry_run: false

cycle_seconds: 300
order_check_seconds: 30

backtest:
  initial_cash: 100000
  start_date: "2025-02-24"
  end_date:   "2025-03-02"
  output_dir: backtest_results
  log_mode: verbose