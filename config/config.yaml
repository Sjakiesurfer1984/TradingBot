strategies:
  - name: pmcc
    pmcc:
      # The underlying equity symbol this PMCC strategy trades on.
      underlying_symbol: SPY

      # Maximum number of simultaneous PMCC spreads (LEAP + NEAR pairs) to hold.
      # Each "unit" = 1 long LEAP call + 1 short NEAR call.
      max_units: 1

      leap:
        dte_min: 365
        dte_max: 545
        target_delta: 0.80

      short:
        dte_min: 21
        dte_max: 45
        target_delta: 0.20

      roll:
        dte_threshold: 14
        delta_threshold: 0.35
        profit_pct: 0.50

      liquidity:
        max_leap_spread_pct: 0.10
        max_near_spread_pct: 0.10

      risk:
        max_buying_power_fraction: 0.50
        max_debit_per_spread_usd: 50000
        max_contracts_per_intent: 3
        slippage_factor: 1.05
        ignore_spread_checks: false

# ---------------------------------------------------------------------------
# Set to true to run the full cycle (positions, signals, sizing) but skip
# all order submission. Nothing will be sent to the broker.
# Use this whenever you're testing logic changes on a live account.
# ---------------------------------------------------------------------------
default_dry_run: true

# How long to wait between cycles, in seconds.
cycle_seconds: 60