default_dry_run: false
cycle_seconds: 60

risk:
  enable_open_order_dedupe: true

strategies:
  - name: pmcc
    pmcc:
      underlying_symbol: SPY
      max_units: 2

      leap:
        dte_min: 365
        dte_max: 545
        target_delta: 0.80

      short:
        dte_min: 21
        dte_max: 45
        target_delta: 0.20

      roll:
        dte_threshold: 7
        delta_threshold: 0.35
        profit_pct: 0.50

      liquidity:
        max_leap_spread_pct: 0.15
        max_near_spread_pct: 0.20

      risk:
        equity_budget_pct: 0.50
        max_option_bp_fraction: 0.20
        max_debit_per_spread_usd: 20000
        max_contracts_per_intent: 10
        slippage_factor: 1.05
        ignore_spread_checks: false
