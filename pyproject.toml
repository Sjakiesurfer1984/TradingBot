[project]
name = "tradingbot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "alpaca-py>=0.43.2",
  "pandas>=1.3.0",
  "matplotlib>=3.4.0",
  "python-dotenv>=1.0.0",
]

[tool.uv]
dev-dependencies = [
  "mypy>=0.910",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
